; Configuration files must remain available to FileAccess in exported games.
; No export or signing is performed by adding this preset.
[preset.0]
name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="configs/*.json"
exclude_filter="work/*,configs/README.md,README.md"
export_path="build/Containment Attempt.zip"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]
application/bundle_identifier="com.containment.attempt"
application/short_version="0.2"
application/version="0.2.0"
binary_format/architecture="universal"
codesign/codesign=0
